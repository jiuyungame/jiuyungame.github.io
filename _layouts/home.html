---
layout: default
---

<div class="home">
  {% if page.title %}
    <h1 class="page-heading">{{ page.title }}</h1>
  {% endif %}

  {{ content }}

  {% if site.data["main_part_page"] %}
  <h2>Sections</h2>
  <ul>
  {% for section in site.data["main_part_page"] %}
    <li><a href="{{ section.url | relative_url }}">{{ section.title }}</a></li>
  {% endfor %}
  </ul>
  {% endif %}
</div>
